[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signalpost"
version = "1.2.0"
description = "Evidence-backed public company profiles for Norwegian organisations (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
signalpost = "signalpost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
